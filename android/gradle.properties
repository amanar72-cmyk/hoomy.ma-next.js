# Réglages de compilation Android.
#
# Les plafonds mémoire sont volontairement bas : la compilation Kotlin des
# plugins Capacitor est gourmande et le daemon Gradle se fait tuer par l'OOM
# killer sur une machine partagée. Ces valeurs tiennent dans ~2,5 Go. Sur un
# poste confortable, les monter accélère nettement la compilation.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx768m

# Compilation séquentielle : le parallélisme multiplierait les JVM simultanées,
# donc la pression mémoire, pour un gain nul sur un projet à un seul module.
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX est requis par Capacitor 8.
android.useAndroidX=true

# Évite de recalculer tout le graphe à chaque invocation.
org.gradle.configuration-cache=false
