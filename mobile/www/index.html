<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HOOMY PRO</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111111;
        color: #faf7f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .centre {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .marque {
        font-size: 1.4rem;
        letter-spacing: 0.18em;
        color: #d4af37;
      }
      .rotor {
        width: 26px;
        height: 26px;
        border: 2px solid #2a2a2a;
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: tourne 0.9s linear infinite;
      }
      @keyframes tourne { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Écran transitoire. En fonctionnement normal la WebView charge
         directement pro.hoomy.ma (server.url) et cette page n'apparaît pas. -->
    <div class="centre">
      <div class="marque">HOOMY PRO</div>
      <div class="rotor"></div>
    </div>
  </body>
</html>
