<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fait connaître les polices HOOMY à librsvg (moteur SVG de sharp).
     librsvg lit les polices du SYSTÈME via fontconfig, jamais celles
     chargées par next/font : sans ce fichier, le rendu retombe
     silencieusement sur une police générique. -->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.cache</cachedir>
</fontconfig>
